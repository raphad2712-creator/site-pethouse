<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/login.css?v=20261025-hd">
    <title>Cadastro | PetHouse</title>
  </head>
  <body>
    <header class="cabecalho">
      <a class="marca" href="index.html">PetHouse</a>
      <a href="index.html">Voltar ao início</a>
    </header>
  <main>
    <section class="container" aria-labelledby="titulo-cadastro">
      <h1 id="titulo-cadastro">Cadastro</h1>

      <form action="login.html">
        <label for="nome">Nome completo</label>
        <input id="nome" type="text" placeholder="Digite seu nome completo" required>

        <label for="usuario">Usuário</label>
        <input id="usuario" type="text" placeholder="Crie seu usuário" required>

        <label for="email">E-mail</label>
        <input id="email" type="email" placeholder="Digite seu e-mail" required>

        <label for="senha">Senha</label>
        <input id="senha" type="password" placeholder="Crie sua senha" required>

        <label for="confirmar-senha">Confirmar senha</label>
        <input id="confirmar-senha" type="password" placeholder="Digite sua senha novamente" required>

        <button type="submit">Cadastrar</button>
      </form>

      <p>Já tem uma conta?</p>
      <a href="login.html" class="botao-cadastro">Já tenho cadastro</a>
    </section>
  </main>

    <footer>
      <p><strong>PetHouse</strong><br>Tudo para o seu pet.</p>
      <p>© 2026 PetHouse</p>
    </footer>
  </body>
</html>
