<body>
<header class="cabecalho">
  <a class="marca" href="index.html">PetHouse</a>
  <nav aria-label="Menu principal">

<main>
<section class="area-login">
  <h1>Entrar</h1>
  <p>Área de login para demonstração.</p>
  <form class="form-login">
    <label for="email">E-mail</label>
    <input id="email" type="email" placeholder="Seu e-mail" autocomplete="off">
    <label for="senha">Senha</label>
    <input id="senha" type="password" placeholder="Sua senha" autocomplete="off">
    <button type="button" class="botao">Entrar</button>
    <p>Este login é apenas visual e não faz autenticação.</p>
  </form>
</section>
</main>
<footer><p><strong>PetHouse</strong><br>Tudo para o seu pet.</p><p>© 2026 PetHouse</p></footer>
