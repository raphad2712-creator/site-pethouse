<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/login.css?v=20261025-2">
  <title>Login | PetHouse</title>
</head>
<body>
  <header class="cabecalho">
    <a class="marca" href="index.html">PetHouse</a>
    <a href="index.html">Voltar ao início</a>
  </header>

  <main>
    <section class="container" aria-labelledby="titulo-login">
      <h1 id="titulo-login">Login</h1>
      <p class="aviso">Acesso demonstrativo. Use dados fictícios.</p>
      <form action="produtos.html">
        <label for="usuario">Usuário</label>
        <input id="usuario" type="text" placeholder="Digite seu usuário" autocomplete="off" required>

        <label for="senha">Senha</label>
        <input id="senha" type="password" placeholder="Digite sua senha" autocomplete="off" required>

        <button type="submit">Entrar</button>
      </form>
      <p class="ajuda">Nesta demonstração, o botão Entrar abre a página de produtos.</p>
    </section>
  </main>

  <footer>
    <p><strong>PetHouse</strong><br>Tudo para o seu pet.</p>
    <p>© 2026 PetHouse</p>
  </footer>
</body>
</html>
