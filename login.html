<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="imagens/logo-pethouse.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
  <title>Login | PetHouse</title>
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>
  <header class="cabecalho">
    <a class="marca" href="index.html"><img class="logo-marca" src="imagens/logo-pethouse.png" alt=""><span>PetHouse</span></a>
    <a href="index.html">Voltar ao início</a>
  </header>

  <main id="conteudo">
    <section class="container" aria-labelledby="titulo-login">
      <h1 id="titulo-login">Login</h1>
      <form action="produtos.html">
        <p class="ajuda">Os campos com * são obrigatórios.</p>
        <label for="usuario">Usuário *</label>
        <input id="usuario" type="text" pattern="[A-Za-z0-9_]{3,20}" title="Use de 3 a 20 letras sem acento, números ou sublinhado" placeholder="Digite seu usuário" required autocomplete="username" aria-describedby="ajuda-usuario">
        <small class="ajuda" id="ajuda-usuario">Use de 3 a 20 letras sem acento, números ou sublinhado.</small>

        <label for="senha">Senha *</label>
        <input id="senha" type="password" minlength="6" placeholder="Digite sua senha" required autocomplete="current-password" aria-describedby="ajuda-senha">
        <small class="ajuda" id="ajuda-senha">Use no mínimo 6 caracteres.</small>

        <button type="submit">Entrar</button>
        <p>Não tem uma conta?</p>
        <a href="cadastro.html">Cadastre-se</a>
      </form>
    </section>
  </main>

  <footer>
    <p><strong>PetHouse</strong><br>Tudo para o seu pet.</p>
    <p>© 2026 PetHouse</p>
  </footer>
</body>
</html>
