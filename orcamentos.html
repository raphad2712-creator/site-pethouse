<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orçamentos | PetHouse</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="cabecalho">
    <a class="marca" href="index.html">PetHouse</a>
    <nav aria-label="Menu principal">
      <a href="index.html">Início</a>
      <a href="produtos.html">Produtos</a>
      <a href="fornecedores.html">Fornecedores</a>
      <a href="orcamentos.html" aria-current="page">Orçamentos</a>
      <a href="feedbacks.html">Feedbacks</a>
      <a href="fidelidade.html">Fidelidade</a>
      <a href="agendamento.html">Agendamento</a>
      <a href="carrinho.html">Carrinho</a>
      <a href="contato.html">Contato</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <main>
    <section id="orcamentos">
      <div class="titulo">
        <p class="destaque">Compras em quantidade</p>
        <h1>Solicite um orçamento</h1>
        <p>Preencha o formulário e responderemos com uma proposta em até 2 dias úteis.</p>
      </div>
      <form action="mailto:contato@pethouse.com.br" method="post" enctype="text/plain">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required>

        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" name="telefone">

        <label for="categoria">Categoria de interesse</label>
        <select id="categoria" name="categoria">
          <option>Alimentação</option>
          <option>Passeio</option>
          <option>Descanso</option>
          <option>Higiene</option>
          <option>Brinquedos</option>
          <option>Transporte</option>
        </select>

        <label for="quantidade">Quantidade estimada de itens</label>
        <input type="number" id="quantidade" name="quantidade" min="1" required>

        <label for="prazo">Prazo desejado para entrega</label>
        <input type="date" id="prazo" name="prazo">

        <label for="detalhes">Detalhes do pedido</label>
        <textarea id="detalhes" name="detalhes" rows="5"></textarea>

        <button class="botao" type="submit">Enviar solicitação</button>
      </form>
    </section>
  </main>

  <footer>
    <p><strong>PetHouse</strong><br>Tudo para o seu pet.</p>
    <p>© 2026 PetHouse</p>
  </footer>
</body>
</html>
